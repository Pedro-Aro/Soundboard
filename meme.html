
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Soundboard - Memes</title>

    <link rel="shortcut icon" href="assets/images/bateria.png" type="image/x-icon">
    <link rel="stylesheet" href="styles/style.css">
</head>

<body id="meme">

    <header>

        <a href="index.html">
            <button>Voltar</button>
        </a>

        <h1>Soundboard</h1>
        <h2>Efeitos de Meme</h2>

    </header>


    <div class="destaque">

        <img id="imagem_meme"
            src="assets/images/bateria.webp"
            alt="Imagem do som">

        <h3 id="nome_meme">Escolha um som</h3>

    </div>


    <section class="teclado">

        <button class="tecla tecla_fah"
            data-imagem="assets/images/fah.jpg">
            Fahhhhh
        </button>

        <button class="tecla tecla_jew"
            data-imagem="assets/images/jew.jpg">
            Jew Song
        </button>

        <button class="tecla tecla_peido"
            data-imagem="assets/images/peido.jpg">
            Peido
        </button>

        <button class="tecla tecla_ai"
            data-imagem="assets/images/ai.jpg">
            AIIIIIIIIII AIIIIIIIIII
        </button>

        <button class="tecla tecla_instinct"
            data-imagem="assets/images/instinct.jpg">
            Ultra Instinct Goku
        </button>

        <button class="tecla tecla_risada"
            data-imagem="assets/images/risada.jpg">
            Risada
        </button>

    </section>


    <audio src="assets/sounds/keyq (2).mp3" id="som_tecla_fah"></audio>
    <audio src="assets/sounds/keyw (2).mp3" id="som_tecla_jew"></audio>
    <audio src="assets/sounds/keye (2).mp3" id="som_tecla_peido"></audio>
    <audio src="assets/sounds/keya (2).mp3" id="som_tecla_ai"></audio>
    <audio src="assets/sounds/keys (2).mp3" id="som_tecla_instinct"></audio>
    <audio src="assets/sounds/keyd (2).mp3" id="som_tecla_risada"></audio>


    <script src="scripts/app.js"></script>

</body>

</html>
